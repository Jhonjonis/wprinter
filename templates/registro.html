{% extends "base.html" %}

{% block title %}Registro - TechOutsourcing{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-primary-custom text-white text-center py-4">
                    <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Criar Conta</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('registro') }}">
                        <div class="mb-3">
                            <label for="name" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="password" name="password" required minlength="6">
                            <div class="form-text">A senha deve ter pelo menos 6 caracteres.</div>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 py-2">
                            <i class="fas fa-user-plus me-2"></i>Criar Conta
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-muted">Já tem uma conta? 
                            <a href="{{ url_for('login') }}" class="text-primary-custom text-decoration-none">
                                Faça login aqui
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
